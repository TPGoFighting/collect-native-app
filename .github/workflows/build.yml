name: Build Collect Android (release)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform + build-tools
        # ubuntu-latest runners ship a preinstalled SDK (ANDROID_HOME is set);
        # do NOT use android-actions/setup-android — its default `tools` package
        # no longer exists and fails the run.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src/

      - name: Offline data-path tests
        run: npm test

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > collect-release.p12
          ls -l collect-release.p12

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: TEMP DEBUG watchedDirectories
        run: |
          grep -n "watchedDirectories" android/gradle.properties
          cat > /tmp/wd-debug.gradle <<'EOF'
          allprojects {
            afterEvaluate {
              tasks.findByName("generateInlineModules")?.with {
                doFirst {
                  println("WD-CMD project=" + project.path)
                  println("WD-CMD watched=[" + watchedDirectoriesSerialized.get() + "]")
                  println("WD-CMD mirror=" + mirrorDirectory.get().asFile.absolutePath)
                  println("WD-CMD output=" + outputDirectory.get().asFile.absolutePath)
                  println("WD-CMD nodeDir=" + nodeWorkingDir.get().asFile.absolutePath)
                }
              }
            }
          }
          EOF
          (cd android && ./gradlew -I /tmp/wd-debug.gradle :expo:generateInlineModules 2>&1 | grep -E "WD-CMD|expo-modules-autolinking failed|FAILED|BUILD" | head -15 || true)

      - name: Write gradle.properties (signing)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/gradle.properties <<EOF
          COLLECT_KEYSTORE_PASSWORD=$STORE_PASSWORD
          COLLECT_KEY_ALIAS=$KEY_ALIAS
          COLLECT_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found" >&2; exit 1; }
          unzip -t "$APK" > /dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          echo "aapt: $AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|launchable-activity"
          echo "$BADGING" | grep -q "name='top.tpgofighting.collect'" || { echo "wrong package name" >&2; exit 1; }
          echo "$BADGING" | grep -q "versionCode='3'" || { echo "wrong versionCode (want 3)" >&2; exit 1; }
          echo "$BADGING" | grep -q "versionName='2.0.0'" || { echo "wrong versionName (want 2.0.0)" >&2; exit 1; }
          SIZE="$(stat -c%s "$APK")"
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          if [ "$SIZE" -gt 31457280 ]; then echo "APK over 30 MB hard cap" >&2; exit 1; fi
          if [ "$SIZE" -gt 26214400 ]; then echo "WARNING: APK over 25 MB target"; fi
          cp "$APK" collect-v2.0.0.apk
          sha256sum collect-v2.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: collect-v2.0.0
          path: collect-v2.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: collect-v2.0.0.apk
          body: |
            Collect 原生安卓版 v2.0.0 — 离线可读的口袋阅读器。

            **重要：老用户必须先卸载旧版再安装。**
            v1.x 是 debug 签名，v2.0.0 换了正式 release 签名，无法覆盖升级。卸载前请注意：旧版没有可迁移的数据。

            包含：42 篇文章全文离线包（启动即读，无需联网）、首页时间线 + 平台筛选、原生阅读页（目录 / 字号五档 / 纯黑夜间）、收藏与阅读历史、搜索、推荐文章待转换列表。

            SHA256 见下方校验和。
