name: Build Collect Android (release)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # The release step needs to create GitHub Releases; the repo's default
    # GITHUB_TOKEN permissions are read-only for contents, so declare it.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform + build-tools
        # ubuntu-latest runners ship a preinstalled SDK (ANDROID_HOME is set);
        # do NOT use android-actions/setup-android — its default `tools` package
        # no longer exists and fails the run.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npx eslint src/

      - name: Offline data-path tests
        run: |
          npm test
          npm run test:v210
          npm run test:unit
          npm run test:release-crash

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "ANDROID_KEYSTORE_BASE64 is not set" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > collect-release.p12
          ls -l collect-release.p12

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --non-interactive

      - name: Write gradle.properties (signing)
        # NOTE: android/gradle.properties as generated by `expo prebuild` has NO
        # trailing newline. Appending without one glued the first COLLECT line
        # onto `expo.inlineModules.watchedDirectories=[]`, corrupting that
        # property's value to `[]COLLECT_KEYSTORE_PASSWORD=...` and breaking the
        # Expo autolinking JSON.parse (see run 44468613551). Always prepend a
        # newline before appending.
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<EOF
          COLLECT_KEYSTORE_PASSWORD=$STORE_PASSWORD
          COLLECT_KEY_ALIAS=$KEY_ALIAS
          COLLECT_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          grep -c "^COLLECT_" android/gradle.properties

      - name: Build release APK
        # -Pexpo.inlineModules.watchedDirectories='[]': belt-and-braces override
        # for the Expo plugin's fragile JSON.parse of this property (see above).
        # -PreactNativeArchitectures=arm64-v8a: single ABI per the product design
        # (the template default ships 4 ABIs and balloons the APK past 100 MB).
        # -Pexpo.useLegacyPackaging=true: compress .so files in the APK (the
        # template default stores them uncompressed; single-ABI uncompressed
        # still lands at ~37 MB, over the 30 MB cap).
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon -Pexpo.inlineModules.watchedDirectories='[]' -PreactNativeArchitectures=arm64-v8a -Pexpo.useLegacyPackaging=true

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found" >&2; exit 1; }
          unzip -t "$APK" > /dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          echo "aapt: $AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|launchable-activity"
          echo "$BADGING" | grep -q "name='top.tpgofighting.collect'" || { echo "wrong package name" >&2; exit 1; }
          echo "$BADGING" | grep -q "versionCode='5'" || { echo "wrong versionCode (want 5)" >&2; exit 1; }
          echo "$BADGING" | grep -q "versionName='2.1.1'" || { echo "wrong versionName (want 2.1.1)" >&2; exit 1; }
          SIZE="$(stat -c%s "$APK")"
          echo "APK size: $SIZE bytes ($((SIZE / 1024 / 1024)) MB)"
          echo "Largest APK entries:"
          unzip -l "$APK" | sort -k1 -n -r | head -12
          if [ "$SIZE" -gt 31457280 ]; then echo "APK over 30 MB hard cap" >&2; exit 1; fi
          if [ "$SIZE" -gt 26214400 ]; then echo "WARNING: APK over 25 MB target"; fi
          cp "$APK" collect-v2.1.1.apk
          sha256sum collect-v2.1.1.apk

      - name: Verify APK signature (release keystore)
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify collect-v2.1.1.apk || { echo "apksigner verify FAILED" >&2; exit 1; }
          KEY_FP="$(keytool -list -v -keystore collect-release.p12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep -i "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')"
          APK_FP="$("$APKSIGNER" verify --print-certs collect-v2.1.1.apk 2>/dev/null | grep -i "SHA-256" | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')"
          echo "keystore cert SHA-256: $KEY_FP"
          echo "apk cert SHA-256:      $APK_FP"
          if [ -z "$KEY_FP" ] || [ "$KEY_FP" != "$APK_FP" ]; then
            echo "SIGNATURE MISMATCH: APK is not signed with the release keystore" >&2
            exit 1
          fi
          echo "Signature OK: APK is signed with the release keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: collect-v2.1.1
          path: collect-v2.1.1.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: collect-v2.1.1.apk
          body: |
            Collect 原生安卓版 v2.1.1 — 离线可读的口袋阅读器。

            **升级说明：**
            v2.0.0/v2.1.0 用户可直接覆盖升级到 v2.1.1（release 签名一致）。v1.x 是 debug 签名，需要先卸载。升级后建议在「我的 → 备份与恢复」导出一次数据。

            包含：42 篇文章全文离线包（启动即读，无需联网）、首页时间线 + 平台筛选、原生阅读页（目录 / 字号五档 / 纯黑夜间）、收藏与阅读历史、搜索、推荐文章待转换列表。

            SHA256 见下方校验和。
