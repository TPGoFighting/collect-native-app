name: Diagnose Collect Android startup (release APK)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct URL of the release APK to install
        required: true
        default: https://collect.tpgofighting.top/downloads/collect-v2.1.0.apk

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download release APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          case "$APK_URL" in
            https://*) ;;
            *) echo "apk_url must be an https URL" >&2; exit 1 ;;
          esac
          for i in 1 2 3 4 5; do
            rm -f collect-test.apk
            if curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 "$APK_URL" -o collect-test.apk; then
              break
            fi
            sleep 10
          done
          test -s collect-test.apk
          unzip -t collect-test.apk > /dev/null
          sha256sum collect-test.apk

      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: collect-diagnose
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set +e
            adb logcat -c

            echo "=== install ==="
            adb install -r collect-test.apk
            INSTALL_RC=$?
            echo "install exit: $INSTALL_RC"

            echo "=== launch ==="
            adb shell monkey -p top.tpgofighting.collect -c android.intent.category.LAUNCHER 1
            LAUNCH_RC=$?
            echo "launch exit: $LAUNCH_RC"

            sleep 20
            adb logcat -d -v threadtime > logcat-full.txt

            echo "=== process check ==="
            adb shell pidof top.tpgofighting.collect
            PIDOF_RC=$?
            echo "pidof exit: $PIDOF_RC"

            echo "=== filtered logcat ==="
            grep -iE 'top\.tpgofighting|AndroidRuntime|FATAL|ReactNativeJS|Exception|Error|crash|System\.out' logcat-full.txt | tail -500 || true

            echo "DIAGNOSE_DONE install=$INSTALL_RC launch=$LAUNCH_RC pidof=$PIDOF_RC"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-startup-logcat
          path: logcat-full.txt
          if-no-files-found: warn
